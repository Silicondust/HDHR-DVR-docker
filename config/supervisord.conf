[supervisord]
nodaemon=true
user=root

; nginx and php-fpm serve the UI - not started when DVRUI_ENABLE is none
; (DVRUI_WEB_AUTOSTART is set by supervisord.sh)
[program:nginx]
command=nginx
autostart=%(ENV_DVRUI_WEB_AUTOSTART)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm85
autostart=%(ENV_DVRUI_WEB_AUTOSTART)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dvr]
command=/HDHomeRunDVR/hdhomerun.sh
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startretries=0
