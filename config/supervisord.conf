[supervisord]
nodaemon=true
user=root

; supervisorctl control socket - the UI restarts the dvr program through it to
; update the record engine. Only root and the PHP pool's group (DVRUI_CTL_GROUP,
; set by supervisord.sh) can use it.
[unix_http_server]
file=/run/supervisord.sock
chmod=0770
chown=root:%(ENV_DVRUI_CTL_GROUP)s

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

; nginx and php-fpm serve the UI - not started when DVRUI_ENABLE is none
; (DVRUI_WEB_AUTOSTART is set by supervisord.sh)
[program:nginx]
command=nginx
autostart=%(ENV_DVRUI_WEB_AUTOSTART)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm85
autostart=%(ENV_DVRUI_WEB_AUTOSTART)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; hdhomerun.sh updates the engine and runs it - a restart (the UI's engine
; update) stops the whole process group, so the engine stops along with the script
[program:dvr]
command=/HDHomeRunDVR/hdhomerun.sh
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startretries=0
