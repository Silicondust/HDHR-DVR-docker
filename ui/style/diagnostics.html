<div id="diagnostics_content">
	<div id="diagnostics_bar">
		<span class="diagnostics_title">Diagnostics<span id="diagnostics_section_name"></span></span>
		<button type="button" class="logfile_download" title="Download all the diagnostics as a text file" onclick="downloadDiagnostics()"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg><span class="logfile_download_label">Download</span></button>
	</div>
	<!-- data-show is the section shown (all for every section) - see showDiagSection() -->
	<div id="diagnostics_main" data-show="all">
		<nav id="diagnostics_nav" aria-label="Diagnostics sections">
			<button type="button" class="diag_nav" data-section="system" title="System" aria-label="System" onclick="showDiagSection('system')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg><span class="diag_nav_label">System</span></button>
			<button type="button" class="diag_nav" data-section="config" title="Config File" aria-label="Config File" onclick="showDiagSection('config')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg><span class="diag_nav_label">Config</span></button>
			<button type="button" class="diag_nav" data-section="connectivity" title="Connectivity" aria-label="Connectivity" onclick="showDiagSection('connectivity')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3z"/></svg><span class="diag_nav_label">Network</span></button>
			<button type="button" class="diag_nav" data-section="discovery" title="Discovery" aria-label="Discovery" onclick="showDiagSection('discovery')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span class="diag_nav_label">Discovery</span></button>
			<button type="button" class="diag_nav" data-section="tuners" title="Tuners" aria-label="Tuners" onclick="showDiagSection('tuners')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 16.5h.01M10 16.5h.01M12 13V9"/><path d="M8.5 7.5a5 5 0 0 1 7 0M6 5a8.5 8.5 0 0 1 12 0"/></svg><span class="diag_nav_label">Tuners</span></button>
			<button type="button" class="diag_nav" data-section="engines" title="Record Engines" aria-label="Record Engines" onclick="showDiagSection('engines')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"/><circle cx="9" cy="12" r="3"/><path d="M15 10h3M15 14h3"/></svg><span class="diag_nav_label">Engines</span></button>
			<button type="button" class="diag_nav" data-section="account" title="Account" aria-label="Account" onclick="showDiagSection('account')"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span class="diag_nav_label">Account</span></button>
			<button type="button" class="diag_nav" data-section="series" title="Series" aria-label="Series" onclick="showDiagSection('series')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span class="diag_nav_label">Series</span></button>
			<button type="button" class="diag_nav" data-section="recordings" title="Recordings" aria-label="Recordings" onclick="showDiagSection('recordings')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span class="diag_nav_label">Recordings</span></button>
			<button type="button" class="diag_nav diag_nav_all active" data-section="all" title="All sections" aria-label="All sections" onclick="showDiagSection('all')">ALL</button>
		</nav>
		<div id="diagnostics_pane">
			<div id='diagnostics_box'><!-- dvrui_diagnostics_data --></div>
			<button type="button" id="diagnostics_copy" title="Copy the text shown to the clipboard" aria-label="Copy the text shown to the clipboard" onclick="copyDiagnostics()"><svg class="copy_icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></svg><svg class="copied_icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
		</div>
	</div>
</div>
